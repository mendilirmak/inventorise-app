# Settings for the dev tools only (this app is not packaged).

[tool.pytest.ini_options]
# Lets tests `import app` when pytest runs from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E: style errors, F: pyflakes (unused names and similar), I: import order,
# B: likely bugs, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]
