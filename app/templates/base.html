<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventory{% endblock %} · Inventorise</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('ui.dashboard') }}">Inventorise</a>
    {% if current_user.is_authenticated %}
      <nav>
        <a href="{{ url_for('ui.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('ui.new_product') }}">New product</a>
        <span class="who">{{ current_user.username }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
