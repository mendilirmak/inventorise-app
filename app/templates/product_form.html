{% extends "base.html" %}
{% block title %}New product{% endblock %}
{% block content %}
<section class="panel narrow" aria-labelledby="new-h">
  <h1 id="new-h">New product</h1>
  <form method="post" class="form-actions">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% set default_stock = '0' %}
    {% include "_product_fields.html" %}
    <div class="form-actions"><button type="submit" class="btn">Create product</button></div>
  </form>
</section>
{% endblock %}
