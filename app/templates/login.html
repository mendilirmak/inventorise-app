{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="f-username">Username</label>
      <input id="f-username" name="username" value="{{ username or '' }}" maxlength="64" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="f-password">Password</label>
      <input id="f-password" name="password" type="password" maxlength="256" autocomplete="current-password" required>
    </div>
    <div class="form-actions"><button type="submit" class="btn">Log in</button></div>
  </form>
  <p class="hint form-actions">Accounts are created by an administrator with <code class="sku">flask create-user</code>.</p>
</section>
{% endblock %}
