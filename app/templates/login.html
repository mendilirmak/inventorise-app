{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" value="{{ username or '' }}" maxlength="64" required autofocus></label>
    <label>Password <input name="password" type="password" maxlength="256" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Accounts are created by an administrator with <code>flask create-user</code>.</p>
</section>
{% endblock %}
